site_name: Murine Shift Work
site_description: Behaviour acquisition framework for murine research
site_url: https://MurineShiftWork.github.io/murineshiftwork/
site_author: Lars B. Rollik
repo_url: https://github.com/MurineShiftWork/murineshiftwork
repo_name: MurineShiftWork/murineshiftwork
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.code.copy
  palette:
    scheme: slate
    primary: teal
    accent: teal

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting_started/installation.md
    - Quick Start: getting_started/quickstart.md
    - Your First Session: getting_started/first_session.md
  - How-To Guides:
    - Configure a Setup: setup/setup_config.md
    - Task Settings: howto/task_settings.md
    - Config Overlays: howto/config_overlays.md
    - Manage Subjects: howto/subjects.md
    - Cameras: setup/cameras.md
    - Sound Output: setup/sound.md
    - Open Ephys: howto/open_ephys.md
    - Barcode Sync: howto/barcode_sync.md
    - Photometry (planned): howto/photometry.md
    - Valve Calibration: howto/valve_calibration.md
    - Plot Spec: howto/plot_spec.md
    - Live Plot: howto/live_plot.md
    - Hooks: howto/hooks.md
    - Post-Processing: howto/post_processing.md
  - Concepts:
    - Architecture: concepts/architecture.md
    - Config System: concepts/config_system.md
    - Hook System: concepts/hook_system.md
    - Plugin System: concepts/plugin_system.md
    - Session Files: concepts/session_files.md
    - Multi-Acquisition & Photometry: concepts/multi_acquisition_and_photometry.md
    - Hardware Abstraction: concepts/hardware_abstraction.md
  - CLI Reference:
    - init: cli/init.md
    - run: cli/run.md
    - action: cli/action.md
    - setup: cli/setup.md
    - subject: cli/subject.md
    - calibration: cli/calibration.md
    - post: cli/post.md
    - tasks: cli/tasks.md
    - oe: cli/oe.md
    - flir: cli/flir.md
  - Tasks:
    - Sequence: tasks/sequence.md
    - Probabilistic Switching: tasks/probabilistic_switching.md
    - Probabilistic Switching (Fixed): tasks/probabilistic_switching_fixedsubjects.md
    - Calibration & Test: tasks/calibration_and_test.md
  - API Reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            show_submodules: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true
