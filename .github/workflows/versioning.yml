name: Versioning

# Bump + tag only. Publishing is decoupled into release.yml (so OIDC stays bound
# to the release.yml filename, and a hand-pushed tag publishes too).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    name: Bump and tag
    runs-on: ubuntu-26.04
    # Skip the bump the bot itself just pushed (avoids a loop).
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.MURINESHIFTWORK_CI_CLIENT_ID }}
          private-key: ${{ secrets.MURINESHIFTWORK_CI_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v7

      - name: Bump and tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uvx --from commitizen cz bump --yes || EXIT=$?
          if [ "${EXIT:-0}" -eq 21 ] || [ "${EXIT:-0}" -eq 6 ]; then
            echo "No bumpable commits since last tag — nothing to release."
            exit 0
          fi
          [ "${EXIT:-0}" -eq 0 ] || exit $EXIT
          VERSION="v$(cat VERSION)"
          git push origin HEAD:main
          # Pushed with the App token, so the tag triggers release.yml's push:tags
          # (a GITHUB_TOKEN push would not). No dispatch: it would publish twice.
          git push origin "$VERSION"
