name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "src/**/*.py"   # rebuild on source changes if using mkdocstrings
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy docs to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Mints via `app-id` (numeric App ID 4203266 = murineshiftwork-ci, in `CI_APP_ID`) + its
      # `CI_APP_PRIVATE_KEY`. `app-id` is deprecated on @v3 in favour of `client-id`, but GitHub
      # currently rejects the client-id-issued JWT on the installation lookup ("JSON web token could
      # not be decoded", 401), so we stay on the (warning-only) app-id until that is fixed upstream.
      # murineshiftwork-ci Client ID (Iv23liaP7u2T0HsqR03a) is kept in `MURINESHIFTWORK_CI_CLIENT_ID`
      # for the retry.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: msw-agent

      - name: Configure git to use the App token for private repos
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Add private package sources (not on PyPI)
        shell: python
        run: |
          with open('pyproject.toml', 'a') as f:
              f.write('\n[tool.uv.sources]\n')
              f.write('msw-agent = { git = "https://github.com/MurineShiftWork/msw-agent" }\n')

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Deploy
        run: uv run mkdocs gh-deploy --force
