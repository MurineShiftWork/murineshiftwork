name: Renovate

on:
  # Nightly run; Renovate honours the weekly window in renovate.json for opening
  # PRs, and the nightly cadence lets a green weekly PR auto-merge within a day.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOG_LEVEL: debug
  RENOVATE_REPOSITORIES: ${{ github.repository }}  # operate on this repo only

jobs:
  renovate:
    name: Renovate dependency scan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      # Author PRs as the murineshiftwork-ci App, not GITHUB_TOKEN: a PR opened with
      # GITHUB_TOKEN triggers no other workflow, so CI would not run on it and its
      # merge would not trigger versioning. The App also sees private repos and has
      # Commit statuses, which minimumReleaseAge needs. Without owner/repositories
      # the token is scoped to this repo.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.MURINESHIFTWORK_CI_CLIENT_ID }}
          private-key: ${{ secrets.MURINESHIFTWORK_CI_PRIVATE_KEY }}

      - uses: renovatebot/github-action@v46.1.17
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
