name: Renovate

on:
  schedule:
    - cron: "0 2 * * *"  # nightly 02:00 UTC (testing cadence)
  push:
    branches: [main]     # also refresh deps in the normal flow, ahead of versioning
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LOG_LEVEL: debug

jobs:
  renovate:
    name: Renovate dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Author PRs with the org App, not GITHUB_TOKEN: a PR opened with
      # GITHUB_TOKEN does not trigger other workflows, so ci.yml would not run on
      # the PR (breaking the CI-gated automerge) and the merge would not trigger
      # versioning.yml. App-token events do trigger those, so the dep bump flows
      # PR -> CI -> automerge -> versioning -> release as intended.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: murineshiftwork

      - uses: renovatebot/github-action@v46
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
